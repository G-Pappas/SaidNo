<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Fixture: no cookie banner, site's own menu locks scrolling</title>
    <style>
      body { overflow: hidden; }
      main { height: 4000px; }
      #menu { position: fixed; inset: 0 40% 0 0; background: #fff; padding: 20px; }
    </style>
  </head>
  <body>
    <main><h1>Shop</h1></main>
    <nav id="menu">
      <p>Menu: Home, Products, Contact us, Delivery and returns, About the company.</p>
      <button>Close menu</button>
    </nav>
  </body>
</html>
