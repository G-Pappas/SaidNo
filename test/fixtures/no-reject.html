<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Fixture: banner without a reject option</title>
    <style>
      body { overflow: hidden; }
      main { height: 4000px; }
      .cc { position: fixed; top: 30%; left: 20%; right: 20%; padding: 20px; background: #fff; z-index: 11; }
      .film { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 10; }
    </style>
  </head>
  <body>
    <main><h1>Article</h1></main>
    <div class="film"></div>
    <div class="cc">
      <p>By continuing to browse this site you agree to our use of cookies.</p>
      <a href="#" class="cc-ok">Got it</a>
    </div>
  </body>
</html>
